<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathMentor — Calculadora Inteligente</title>
  <link rel="stylesheet" href="styles.css?v=34" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body data-page="home">
  <div id="app">

    <!-- ============ HOME ============ -->
    <template v-if="currentView === 'home'">

      <!-- Header -->
      <header class="site-header">
        <a href="#" class="site-brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Math<span>Mentor</span></span>
        </a>
        <nav class="site-nav">
          <a href="#features">Cómo funciona</a>
          <a href="#topics">Temas</a>
          <a href="#stats">Resultados</a>
          <label class="theme-switch" :title="isDarkMode ? 'Modo noche' : 'Modo dia'" aria-label="Cambiar modo dia y noche">
            <input type="checkbox" class="theme-switch__checkbox" :checked="isDarkMode" @change="toggleTheme" />
            <span class="theme-switch__container" aria-hidden="true">
              <span class="theme-switch__clouds"></span>
              <span class="theme-switch__stars-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 55" fill="none">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M135.831 3.00688C135.055 3.85027 134.111 4.29946 133 4.35447C134.111 4.40947 135.055 4.85867 135.831 5.71123C136.607 6.55462 136.996 7.56303 136.996 8.72727C136.996 7.95722 137.172 7.25134 137.525 6.59129C137.886 5.93124 138.372 5.39954 138.98 5.00535C139.598 4.60199 140.268 4.39114 141 4.35447C139.88 4.2903 138.936 3.85027 138.16 3.00688C137.384 2.16348 136.996 1.16425 136.996 0C136.996 1.16425 136.607 2.16348 135.831 3.00688ZM31 23.3545C32.1114 23.2995 33.0551 22.8503 33.8313 22.0069C34.6075 21.1635 34.9956 20.1642 34.9956 19C34.9956 20.1642 35.3837 21.1635 36.1599 22.0069C36.9361 22.8503 37.8798 23.2903 39 23.3545C38.2679 23.3911 37.5976 23.602 36.9802 24.0053C36.3716 24.3995 35.8864 24.9312 35.5248 25.5913C35.172 26.2513 34.9956 26.9572 34.9956 27.7273C34.9956 26.563 34.6075 25.5546 33.8313 24.7112C33.0551 23.8587 32.1114 23.4095 31 23.3545ZM0 36.3545C1.11136 36.2995 2.05513 35.8503 2.83131 35.0069C3.6075 34.1635 3.99559 33.1642 3.99559 32C3.99559 33.1642 4.38368 34.1635 5.15987 35.0069C5.93605 35.8503 6.87982 36.2903 8 36.3545C7.26792 36.3911 6.59757 36.602 5.98015 37.0053C5.37155 37.3995 4.88644 37.9312 4.52481 38.5913C4.172 39.2513 3.99559 39.9572 3.99559 40.7273C3.99559 39.563 3.6075 38.5546 2.83131 37.7112C2.05513 36.8587 1.11136 36.4095 0 36.3545Z" fill="currentColor" />
                </svg>
              </span>
              <span class="theme-switch__circle-container">
                <span class="theme-switch__sun-moon-container">
                  <span class="theme-switch__moon">
                    <span class="theme-switch__spot"></span>
                    <span class="theme-switch__spot"></span>
                    <span class="theme-switch__spot"></span>
                  </span>
                </span>
              </span>
            </span>
          </label>
          <a href="#" class="nav-cta" @click.prevent="scrollStart">Empezar</a>
        </nav>
      </header>

      <!-- Hero -->
      <section class="hero">
        <div class="hero-bg-shapes">
          <div class="math-rain" aria-hidden="true">
            <span>+</span>
            <span>−</span>
            <span>×</span>
            <span>÷</span>
            <span>=</span>
            <span>√</span>
            <span>%</span>
            <span>π</span>
            <span>+</span>
            <span>×</span>
            <span>−</span>
            <span>÷</span>
            <span>=</span>
            <span>√</span>
          </div>
        </div>

        <div class="hero-content">
          <!-- Mascota -->
          <div class="mascot" aria-hidden="true">
            <div class="monitor">
              <div class="monitor-dots"><span></span><span></span><span></span></div>
              <div class="eye-row">
                <div class="eye"></div>
                <div class="eye"></div>
              </div>
            </div>
            <div class="monitor-stand"></div>
            <div class="monitor-base"></div>
          </div>

          <h1 class="hero-title">
            La calculadora<br>
            que te <span class="accent">enseña</span> <span class="slash">/</span> a pensar.
          </h1>

          <p class="hero-subtitle">
            No damos solo el resultado. Desglosamos <strong>cada paso</strong>, explicamos el <strong>concepto</strong> y te retamos con desafíos. Aritmética, álgebra, fracciones y más.
          </p>

          <div class="age-selector" id="start">
            <!-- Nivel que define los temas disponibles. -->
            <p class="age-label">// Selecciona tu nivel</p>
            <div class="age-buttons">
              <button
                v-for="age in ageRanges"
                :key="age.value"
                :class="['age-btn', { active: selectedAge === age.value }]"
                @click="selectedAge = age.value"
              >{{ age.label }}</button>
            </div>

            <!-- Login real con Google mediante Firebase. -->
            <button class="google-login-btn" type="button" @click="signInWithGoogle" :disabled="!selectedAge || isAuthLoading">
              <span>{{ isAuthLoading ? 'Conectando...' : 'Continuar con Google' }}</span>
            </button>
            <p class="auth-help" v-if="authMessage">{{ authMessage }}</p>

            <!-- Respaldo local para probar sin cuenta de Google. -->
            <label class="student-login-label" for="student-name">// O usa perfil local</label>
            <input
              id="student-name"
              class="student-login-input"
              type="text"
              v-model="studentName"
              placeholder="Escribe tu nombre"
              maxlength="24"
              autocomplete="name"
              @keyup.enter="startApp"
            />
          </div>

          <div class="cta-row">
            <button class="cta-btn" @click="startApp" :disabled="!selectedAge || !studentName.trim()">
              <span>Iniciar sesión</span>
              <span class="cta-arrow">→</span>
            </button>
            <a class="cta-ghost" href="#features">
              Ver cómo funciona
            </a>
          </div>
        </div>
      </section>

      <!-- Features -->
      <section class="section" id="features">
        <div class="section-inner">
          <div class="section-head">
            <span class="section-eyebrow">// CÓMO FUNCIONA</span>
            <h2 class="section-title">Entiende <span class="accent">qué</span> pasa, no solo el resultado.</h2>
            <p class="section-desc">Diseñado para estudiantes de 10 a 15 años. Cada respuesta viene con desglose, concepto clave y un reto para reforzar el aprendizaje.</p>
          </div>

          <div class="feature-grid">
            <div class="feature-card">
              <div class="fc-num">01</div>
              <div class="fc-icon">◐</div>
              <h3>Paso a paso</h3>
              <p>Cada operación se descompone en pasos ordenados con explicación clara del porqué.</p>
            </div>
            <div class="feature-card">
              <div class="fc-num">02</div>
              <div class="fc-icon">◇</div>
              <h3>Concepto clave</h3>
              <p>Al final de cada ejercicio, un resumen del principio matemático que acabas de aplicar.</p>
            </div>
            <div class="feature-card">
              <div class="fc-num">03</div>
              <div class="fc-icon">△</div>
              <h3>Desafío instantáneo</h3>
              <p>Un mini-reto tras cada problema para verificar que realmente lo entendiste.</p>
            </div>
            <div class="feature-card">
              <div class="fc-num">04</div>
              <div class="fc-icon">◎</div>
              <h3>Niveles adaptativos</h3>
              <p>Temas que crecen contigo: desde aritmética básica hasta álgebra y raíces.</p>
            </div>
            <div class="feature-card">
              <div class="fc-num">05</div>
              <div class="fc-icon">▨</div>
              <h3>Racha de aprendizaje</h3>
              <p>Tu progreso se registra en una racha que te motiva a practicar cada día.</p>
            </div>
            <div class="feature-card">
              <div class="fc-num">06</div>
              <div class="fc-icon">✕</div>
              <h3>Sin distracciones</h3>
              <p>Interfaz limpia. Sin anuncios, sin ruido. Solo tú y las matemáticas.</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Stats -->
      <section class="section" id="stats">
        <div class="section-inner">
          <div class="section-head">
            <span class="section-eyebrow">// RESULTADOS</span>
            <h2 class="section-title">Aprendizaje <span class="accent">medible</span>.</h2>
          </div>

          <div class="stats-strip">
            <div class="stat">
              <div class="stat-num">6</div>
              <div class="stat-label">Temas</div>
            </div>
            <div class="stat">
              <div class="stat-num">∞</div>
              <div class="stat-label">Problemas</div>
            </div>
            <div class="stat">
              <div class="stat-num">3</div>
              <div class="stat-label">Niveles</div>
            </div>
            <div class="stat">
              <div class="stat-num">100%</div>
              <div class="stat-label">Gratis</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Topics -->
      <section class="section" id="topics">
        <div class="section-inner">
          <div class="section-head">
            <span class="section-eyebrow">// TEMAS DISPONIBLES</span>
            <h2 class="section-title">Todo lo que necesitas, <span class="accent">en un lugar</span>.</h2>
          </div>

          <div class="topics-preview">
            <div class="topic-preview">
              <div class="tp-icon">TEMA.01</div>
              <h4>Aritmética</h4>
              <p>Suma, resta, multiplicación y división con jerarquía de operaciones.</p>
            </div>
            <div class="topic-preview">
              <div class="tp-icon">TEMA.02</div>
              <h4>Fracciones</h4>
              <p>Operaciones completas incluyendo denominador común y simplificación.</p>
            </div>
            <div class="topic-preview">
              <div class="tp-icon">TEMA.03</div>
              <h4>Porcentajes</h4>
              <p>Cálculo de porcentajes con conversión decimal paso a paso.</p>
            </div>
            <div class="topic-preview">
              <div class="tp-icon">TEMA.04</div>
              <h4>Álgebra</h4>
              <p>Ecuaciones lineales con una incógnita, despeje y verificación.</p>
            </div>
            <div class="topic-preview">
              <div class="tp-icon">TEMA.05</div>
              <h4>Potencias</h4>
              <p>Bases y exponentes con expansión completa de la multiplicación.</p>
            </div>
            <div class="topic-preview">
              <div class="tp-icon">TEMA.06</div>
              <h4>Raíces</h4>
              <p>Raíces cuadradas exactas y aproximadas con análisis entre cuadrados perfectos.</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="site-footer">
        <div class="footer-grid">
          <div class="footer-brand-col">
            <a href="#" class="site-brand">
              <span class="brand-dot"></span>
              <span class="brand-name">Math<span>Mentor</span></span>
            </a>
            <p>Una calculadora inteligente que explica el cómo y el porqué. Hecha para estudiantes de 10 a 15 años.</p>
          </div>
          <div class="footer-col">
            <h5>Producto</h5>
            <ul>
              <li><a href="#features">Cómo funciona</a></li>
              <li><a href="#topics">Temas</a></li>
              <li><a href="#stats">Resultados</a></li>
            </ul>
          </div>
          <div class="footer-col">
            <h5>Recursos</h5>
            <ul>
              <li><a href="#">Guía de uso</a></li>
              <li><a href="#">Para profesores</a></li>
              <li><a href="#">Para padres</a></li>
            </ul>
          </div>
          <div class="footer-col">
            <h5>Empresa</h5>
            <ul>
              <li><a href="#">Acerca de</a></li>
              <li><a href="#">Privacidad</a></li>
              <li><a href="#">Contacto</a></li>
            </ul>
          </div>
        </div>

        <div class="footer-bottom">
          <div>© 2026 MathMentor</div>
        </div>
      </footer>

    </template>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=2"></script>
  <script src="data.js?v=16"></script>
  <script src="addition-visuals.js?v=6"></script>
  <script src="scripts.js?v=24"></script>
</body>
</html>
